name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "NASA Project"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            NASA Project/requirements.txt
            NASA Project/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r api/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the deployable image
        run: docker build -t echo-path .

      - name: Check the site works, under the free hosting plan's memory limit
        run: |
          trap 'docker stats --no-stream site; docker logs site 2>&1 | tail -n 60' EXIT
          docker run -d --name site --memory 512m -p 8000:8000 echo-path
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health && break; sleep 2; done
          curl -fs http://localhost:8000/ | grep -q "Echo-Path 3D"
          curl -fs http://localhost:8000/api/terrains > /dev/null
          curl -fs -X POST -H 'Content-Type: application/json' -d '{"terrain":"lola_site20"}' http://localhost:8000/api/mission > /dev/null
          curl -fs -X POST -H 'Content-Type: application/json' -d '{"terrain":"lola_site20","start":[900,600],"goal":[180,1020]}' http://localhost:8000/api/rover | grep -q '"reached_goal":true'
